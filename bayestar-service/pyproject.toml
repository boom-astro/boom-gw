[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayestar-service"
version = "0.1.0"
description = "Kafka-driven BAYESTAR sky-map localization microservice for boom-gw."
authors = [{ name = "Michael Coughlin", email = "cough052@umn.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.5",
    "ligo.skymap>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[project.scripts]
bayestar-service = "bayestar_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
markers = [
    "bayestar: tests that exercise a real BAYESTAR call (requires ligo.skymap and LALSuite).",
]
# By default, skip the heavy bayestar-marked tests. The CI
# `bayestar-real` job runs them explicitly with `pytest -m bayestar`.
addopts = "-m 'not bayestar'"

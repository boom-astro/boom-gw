name: Container image

# Build the multi-stage Dockerfile (web-builder + cargo + runtime)
# and push to GHCR. The k8s manifests in deploy/nrp/k8s/ reference
# `ghcr.io/boom-astro/boom-gw:latest`; pushing to that tag is what
# lets `kubectl rollout restart` pick up a new build.
#
# Tags pushed:
#   * `latest`           — only on push to main
#   * `sha-<short-sha>`  — every build, so a k8s manifest can pin
#                          to an immutable revision for prod
#   * `vX.Y.Z`           — on `v*` tags
#
# linux/amd64 only for now — NRP/Nautilus runs x86, and the full
# build (Rust + node) is already ~5 min; adding arm64 doubles that.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# `packages: write` lets GITHUB_TOKEN push to ghcr.io/<owner>/<repo>;
# `contents: read` is the default checkout permission. No other
# scopes are needed.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Buildx + GHA cache. The cache makes subsequent builds cheap
      # (the cargo + npm layers re-use prior artifacts) — without it
      # every push redoes the 5-minute Rust compile.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the tag set. `type=ref,event=branch` doesn't apply
      # because we don't push branch tags; `type=raw,value=latest`
      # is gated on main so feature-branch builds don't clobber it.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

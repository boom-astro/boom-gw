name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # rdkafka is built with the gssapi + sasl features, which require
        # libsasl2 (libsasl2-dev) and the GSSAPI Kerberos headers
        # (libkrb5-dev — provides libgssapi_krb5.so and gssapi.h on Ubuntu).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsasl2-dev \
            libkrb5-dev \
            pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --verbose
      - name: Test
        run: cargo test --locked --verbose

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  bayestar-service:
    name: bayestar-service contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The contract tests exercise only `bayestar_service.messages`,
    # which has no runtime deps beyond the stdlib. We deliberately do
    # NOT install ligo.skymap / confluent-kafka here — those are heavy
    # and only the contract is what we want CI to gate on. The
    # BAYESTAR localize path is exercised by hand against a captured
    # coinc.xml fixture (see bayestar-service/README.md), not in CI.
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install --quiet pytest
      - name: Run contract tests
        working-directory: bayestar-service
        run: PYTHONPATH=src pytest tests/ -q

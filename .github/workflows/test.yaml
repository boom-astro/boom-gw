name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # rdkafka is built with the gssapi + sasl features, which require
        # libsasl2 (libsasl2-dev) and the GSSAPI Kerberos headers
        # (libkrb5-dev — provides libgssapi_krb5.so and gssapi.h on Ubuntu).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsasl2-dev \
            libkrb5-dev \
            pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --verbose
      - name: Test
        run: cargo test --locked --verbose

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  bayestar-service:
    name: bayestar-service contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The contract tests exercise only `bayestar_service.messages`,
    # which has no runtime deps beyond the stdlib. We deliberately do
    # NOT install ligo.skymap / confluent-kafka here — those are heavy
    # and only the contract is what we want CI to gate on. The
    # BAYESTAR localize path is exercised by hand against a captured
    # coinc.xml fixture (see bayestar-service/README.md), not in CI.
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install --quiet pytest
      - name: Run contract tests
        working-directory: bayestar-service
        run: PYTHONPATH=src pytest tests/ -q

  integration-kafka:
    # End-to-end self-loop: a single-broker Kafka stands up via service
    # container, a `mongo:8.0` container provides the durable archive,
    # bayestar-service runs in --stub mode (skips BAYESTAR), and three
    # Rust integration tests exercise the full request/result/archive
    # round trip:
    #
    #   * kafka_self_loop_publishes_request_and_receives_stub_result —
    #     publishes a synthetic LocalizeRequest and verifies the stub
    #     FITS comes back on the result topic.
    #   * clusterer_round_trip_attaches_skymap_to_superevent — runs the
    #     library-level clusterer flow: process a synthetic GW event
    #     into a Superevent, fire a LocalizeRequest, receive the
    #     LocalizeResult on the background LocalizerResultConsumer, and
    #     confirm SupereventCreator::attach_skymap lands the FITS on
    #     the open superevent.
    #   * archive_round_trip_through_mongo — writes one of each
    #     archive document (event, superevent with skymap, localize
    #     request, localize result) and reads them back, asserting the
    #     `_id` and FITS round-trip cleanly.
    #   * api_round_trip_against_mongo — mounts the boom-gw HTTP API
    #     onto an in-process actix app, seeds the archive, and asserts
    #     every endpoint returns the expected envelope shape and
    #     payload (including the raw application/fits bytes endpoint,
    #     the POST + GET annotation routes, and the dry-run alert
    #     assembly path).
    #   * alert_publish_lands_on_kafka_and_persists_audit — builds a
    #     real PRELIMINARY alert through the API with an
    #     `AlertPublisher` pointed at the local Kafka, then asserts
    #     the JSON message landed on the alert topic with the IGWN
    #     public-alert shape and the mongo audit row was persisted.
    #   * integration_auth — exercises the full `auth_middleware`
    #     stack with HMAC-signed test tokens and a mock JWKS:
    #     missing token → 401, valid token → 200, missing scope →
    #     401, expired → 401, alert-publish allowlist enforcement
    #     for both allowed and blocked principals.
    #   * integration_grb — exercises the GRB ingest + cross-match
    #     wiring: POST /api/grb-triggers in both Raw (parse from
    #     payload) and Parsed shapes, idempotent upsert behavior,
    #     list + filter routes, single-trigger GET + 404, the
    #     "no skymap → 404" branch on cross-match, and the
    #     cross-match read + sort path after a manual archive seed.
    name: kafka self-loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          # KRaft auto-formats the storage dir on first boot when CLUSTER_ID
          # is set. The value just has to be a valid UUID-ish base64 string;
          # any constant works for an ephemeral CI broker.
          CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      mongo:
        # Matches BOOM proper's mongo version so our archive layer is
        # exercised against the same server we ship behind.
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsasl2-dev \
            libkrb5-dev \
            pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bayestar-service runtime deps
        run: pip install --quiet confluent-kafka
      - name: Wait for Kafka
        run: |
          python - <<'PY'
          import time
          from confluent_kafka.admin import AdminClient
          ac = AdminClient({"bootstrap.servers": "localhost:9092"})
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  md = ac.list_topics(timeout=2)
                  print(f"Kafka up; brokers={list(md.brokers)}")
                  break
              except Exception as e:
                  print(f"waiting for kafka: {e}")
                  time.sleep(2)
          else:
              raise SystemExit("Kafka did not come up within 90s")
          PY
      - name: Wait for MongoDB
        run: |
          # mongo:8.0 ships with `mongosh` baked into the image; we run
          # the health-check from inside the running services container
          # so we never need to install client tooling on the runner.
          for i in $(seq 1 30); do
            if docker exec $(docker ps -qf "ancestor=mongo:8.0") \
                mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" \
                  2>/dev/null | grep -q '^1$'; then
              echo "MongoDB up"
              break
            fi
            echo "waiting for mongo..."
            sleep 2
          done
      - name: Start bayestar-service (stub mode)
        run: |
          mkdir -p /tmp/bayestar-logs
          PYTHONPATH=bayestar-service/src nohup python -m bayestar_service.main \
            --bootstrap-servers localhost:9092 \
            --group-id ci-integration-bayestar \
            --auto-offset-reset earliest \
            --stub \
            --log-level debug \
            > /tmp/bayestar-logs/service.log 2>&1 &
          echo $! > /tmp/bayestar.pid
          # Wait until the service has actually subscribed by tailing the log
          # for the "subscribed to" message. Subscription happens within ~1 s
          # of process start but we give it 30 s for runner-cold-start slack.
          for i in $(seq 1 30); do
            if grep -q "subscribed to request_topic" /tmp/bayestar-logs/service.log 2>/dev/null; then
              echo "bayestar-service subscribed"
              break
            fi
            if ! kill -0 "$(cat /tmp/bayestar.pid)" 2>/dev/null; then
              echo "bayestar-service died early" >&2
              cat /tmp/bayestar-logs/service.log
              exit 1
            fi
            sleep 1
          done
      - name: Run Kafka self-loop integration test
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: cargo test --locked --test integration_kafka -- --ignored --nocapture
      - name: Run MongoDB archive integration test
        env:
          BOOM_GW_MONGO_URI: mongodb://localhost:27017
        run: cargo test --locked --test integration_mongo -- --ignored --nocapture
      - name: Run HTTP API integration test
        env:
          BOOM_GW_MONGO_URI: mongodb://localhost:27017
        run: cargo test --locked --test integration_api -- --ignored --nocapture
      - name: Run alert publish integration test
        env:
          BOOM_GW_MONGO_URI: mongodb://localhost:27017
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: cargo test --locked --test integration_alert -- --ignored --nocapture
      - name: Run auth middleware integration test
        env:
          BOOM_GW_MONGO_URI: mongodb://localhost:27017
        run: cargo test --locked --test integration_auth -- --ignored --nocapture
      - name: Run GRB / cross-match integration test
        env:
          BOOM_GW_MONGO_URI: mongodb://localhost:27017
        run: cargo test --locked --test integration_grb -- --ignored --nocapture
      - name: Dump bayestar-service log
        if: always()
        run: |
          echo "=== bayestar-service log ==="
          cat /tmp/bayestar-logs/service.log || true
      - name: Stop bayestar-service
        if: always()
        run: |
          if [ -f /tmp/bayestar.pid ]; then
            kill "$(cat /tmp/bayestar.pid)" 2>/dev/null || true
          fi

  web-e2e:
    # Hermetic Playwright suite for the React SPA. Every API call is
    # mocked at the network layer (see web/e2e/fixtures.ts) so this
    # job doesn't need mongo, kafka, S3, or the Rust binaries built
    # — it just runs Vite + a headless chromium and asserts on the
    # SPA's rendering and request behavior.
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install npm deps
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          # Bake the @playwright/test version into the cache key so a
          # dep bump triggers a rebuild instead of using stale
          # binaries that don't match the runtime.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright chromium (+ OS deps)
        # `--with-deps` pulls in libnss3 / libnspr4 / etc which the
        # bare GitHub runner doesn't have. Cheap (~5 s) when the
        # browser binary is already cached.
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  bayestar-real:
    # Heavy job: actually runs BAYESTAR against a captured coinc.xml
    # fixture. Installs ligo.skymap from conda-forge (which pulls in
    # LALSuite — about 5-7 minutes of install). Allowed to fail so it
    # never blocks a PR; the value is a regression signal on every push
    # to main and on-demand via workflow_dispatch.
    name: bayestar (real, optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup micromamba + ligo.skymap
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: bayestar-ci
          create-args: >-
            python=3.12
            ligo.skymap
            pytest
          init-shell: bash
          cache-environment: true
      - name: Run real BAYESTAR test
        shell: bash -el {0}
        working-directory: bayestar-service
        run: PYTHONPATH=src pytest tests/test_localize_real.py -m bayestar -v

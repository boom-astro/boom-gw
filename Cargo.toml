[package]
name = "boom-gw"
version = "0.1.0"
edition = "2021"
description = "Gravitational-wave alert ingestion, clustering, and superevent publishing on top of the LIGO/Virgo/KAGRA Kafka topics."
license = "MIT"

[dependencies]
actix-web = "4.11"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3.4"
futures = "0.3"
libc = "0.2"
igwn-ligolw = "0.1"
mongodb = "3.3"
rdkafka = { version = "0.39", features = ["gssapi", "ssl", "tracing", "sasl", "zstd"] }
redis = { version = "0.32", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

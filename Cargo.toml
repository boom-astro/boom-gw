[package]
name = "boom-gw"
version = "0.1.0"
edition = "2021"
description = "Gravitational-wave alert ingestion, clustering, and superevent publishing on top of the LIGO/Virgo/KAGRA Kafka topics."
license = "MIT"

[dependencies]
actix-web = "4.11"
actix-files = "0.6"
anyhow = "1"
aws-config = "1.8"
aws-sdk-s3 = "1.131"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3.4"
futures = "0.3"
libc = "0.2"
igwn-ligolw = "0.1"
jsonwebtoken = "9"
moc = "0.19"
mongodb = "3.3"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "metrics"] }
opentelemetry_sdk = "0.31"
rdkafka = { version = "0.39", features = ["gssapi", "ssl", "tracing", "sasl", "zstd"] }
redis = { version = "0.32", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["base64"] }
thiserror = "2"
zstd = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

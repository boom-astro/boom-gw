# Single-broker Kafka in KRaft mode for the boom-gw internal bus
# (localize-request / localize-result / superevent updates / alert
# topics). PLAINTEXT only — this broker is namespaced internal to
# the boom-gw stack, no SCRAM, no ACLs. See DEPLOYMENT_NOTES.md for
# why the data volume uses `emptyDir` instead of CephFS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
  labels:
    app: broker
    stack: boom-gw
spec:
  serviceName: broker
  replicas: 1
  selector:
    matchLabels:
      app: broker
      stack: boom-gw
  template:
    metadata:
      labels:
        app: broker
        stack: boom-gw
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      containers:
        - name: broker
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 29092
              name: internal
            - containerPort: 9092
              name: client
            - containerPort: 29093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:29093"
            # Empty-host form (`:port`) binds all interfaces but
            # does NOT spook the StorageTool's advertised-listener
            # validation the way `0.0.0.0` does — Kafka 3.9
            # rejects the format-storage step with
            # `advertised.listeners cannot use the nonroutable
            # meta-address 0.0.0.0` when CONTROLLER is bound to
            # 0.0.0.0 here, even though our explicit
            # KAFKA_ADVERTISED_LISTENERS never names 0.0.0.0.
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://broker:29092,PLAINTEXT_HOST://broker:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_NUM_PARTITIONS
              value: "5"
            # boom-gw LocalizeRequests carry the full coinc.xml
            # base64-encoded — routinely > 1 MB. The producer and
            # consumer sides already set message.max.bytes=16 MB
            # (see src/localizer.rs, src/publisher.rs); the broker
            # has to match or it rejects with
            # `MessageSizeTooLarge` at produce time. 16 MB is the
            # same ceiling used in the local docker-compose stack.
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "16777216"
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: "16777216"
            - name: CLUSTER_ID
              value: "5L6g3nShT-eMCtK--X86sw"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:29092 >/dev/null 2>&1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:29092 >/dev/null 2>&1"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: kafka-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: broker
spec:
  selector:
    app: broker
    stack: boom-gw
  publishNotReadyAddresses: true
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: client
      port: 9092
      targetPort: 9092
  clusterIP: None

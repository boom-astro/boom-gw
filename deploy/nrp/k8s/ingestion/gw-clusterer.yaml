# gw-clusterer Deployment.
#
# Reads GraceDB pipeline events from kafka-dev.ligo.org via SCITokens
# (token mounted from the boom-gw-secrets Secret), clusters into
# superevents, writes through to Mongo and Valkey, publishes
# LocalizeRequests to the internal broker, and attaches sky maps
# from the result topic.
#
# To run against the captured replay corpus instead of the live
# GraceDB Kafka, swap the command for
#   /app/gw-clusterer --replay-dir /data/gw-payloads ...
# and mount a PVC containing the dumped envelopes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-clusterer
  labels:
    app: gw-clusterer
    stack: boom-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gw-clusterer
      stack: boom-gw
  template:
    metadata:
      labels:
        app: gw-clusterer
        stack: boom-gw
    spec:
      # The scitoken Secret is mounted at /run/secrets and k8s
      # auto-mounts the service-account token at
      # /run/secrets/kubernetes.io/serviceaccount, which makes runc
      # try to mkdir inside a read-only Secret volume → start
      # failure with `read-only file system`. gw-clusterer never
      # talks to the k8s API, so we don't need the SA token; turn
      # the automount off.
      automountServiceAccountToken: false
      containers:
        - name: gw-clusterer
          image: ghcr.io/boom-astro/boom-gw:latest
          imagePullPolicy: Always
          command:
            - /app/gw-clusterer
            - --bootstrap-servers
            - kafka-dev.ligo.org:9092
            - --group-id
            - boom-gw-clusterer-nrp
            - --token-file
            - /run/secrets/scitoken
            - --redis-url
            - redis://valkey:6379/
            - --localize-servers
            - broker:29092
            - --publish-servers
            - broker:29092
            - --publish-topic
            - boom-gw.superevents
          env:
            # MONGO_PASSWORD must come before MONGO_URI so the
            # `$(BOOM_GW_MONGO_PASSWORD)` reference expands —
            # k8s env-var substitution only looks at vars defined
            # earlier in the list. See core/gw-api.yaml for the
            # same ordering note.
            - name: BOOM_GW_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_MONGO_PASSWORD
            - name: BOOM_GW_MONGO_URI
              value: "mongodb://mongoadmin:$(BOOM_GW_MONGO_PASSWORD)@mongo:27017/admin?authSource=admin"
            - name: BOOM_GW_METRICS_ENABLED
              value: "true"
            - name: BOOM_GW_DEPLOYMENT_ENV
              value: "nrp"
            # Production-style localizer thresholds. BAYESTAR is
            # ~50 s/event in real mode and the GraceDB pipeline
            # event rate is much higher; without a gate the
            # bayestar request topic backs up by ~50× and the
            # SPA shows a growing "no skymap" backlog. SNR ≥ 11
            # cuts ~90% of replay traffic; FAR ≤ 1e-6 Hz mirrors
            # the rough public-alert significance threshold.
            # Tune these for the env you're running in.
            - name: BOOM_GW_LOCALIZE_MIN_SNR
              value: "11.0"
            - name: BOOM_GW_LOCALIZE_MAX_FAR_HZ
              value: "1e-6"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: RUST_LOG
              value: "info,boom_gw=info,rdkafka=warn"
            # Skymap storage — MUST match core/gw-api.yaml. The
            # clusterer writes FITS bytes here when bayestar-service
            # returns a localize result; gw-api reads them when the
            # SPA fetches /api/superevents/{id}/skymap. If the two
            # disagree on backend or bucket, the SPA gets 404 even
            # though the clusterer logs say the FITS persisted fine.
            - name: BOOM_GW_SKYMAP_STORAGE
              value: "s3"
            - name: BOOM_GW_S3_BUCKET
              value: "boom-gw-skymaps"
            - name: BOOM_GW_S3_KEY_PREFIX
              value: "boom-gw"
            - name: BOOM_GW_S3_REGION
              value: "us-east-1"
            - name: BOOM_GW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: BOOM_GW_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_ACCESS_KEY
            - name: BOOM_GW_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_SECRET_KEY
          volumeMounts:
            - name: scitoken
              mountPath: /run/secrets
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: scitoken
          secret:
            secretName: boom-gw-secrets
            items:
              - key: BOOM_GW_SCITOKEN
                path: scitoken
                mode: 0400

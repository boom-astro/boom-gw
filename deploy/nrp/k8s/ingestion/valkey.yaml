# Valkey (Redis-compatible) for open superevent windows. Modest
# storage — boom-gw only persists in-flight superevent state here,
# not history (history lives in MongoDB).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
  labels:
    stack: boom-gw
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-cephfs-east
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app: valkey
    stack: boom-gw
spec:
  replicas: 1
  # The valkey PVC is ReadWriteOnce, so a rolling update can't
  # attach the new pod while the old one still holds the volume.
  # `Recreate` kills the old pod first; the brief downtime is
  # acceptable (boom-gw treats valkey as a cache + state store,
  # not a hard dependency).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
      stack: boom-gw
  template:
    metadata:
      labels:
        app: valkey
        stack: boom-gw
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7.2.6
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # TCP socket probes instead of `exec [redis-cli ping]`:
          # under NRP node oversubscription, exec'ing into the
          # container with a 1 s timeout would get killed by the
          # runtime when the node was busy, restarting valkey
          # every few minutes and dropping every gw-api/gw-
          # clusterer connection. TCP open-port checks don't
          # require an exec.
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-data
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
    stack: boom-gw
  ports:
    - port: 6379
      targetPort: 6379

# Boom-gw secrets for the NRP deployment. Copy to `secrets.yaml`,
# fill in real values, then apply with `make deploy-secrets`.
#
# `BOOM_GW_MONGO_PASSWORD` is the MongoDB root password we set on the
# `mongo` StatefulSet. Every component that talks to mongo reads it
# from this Secret.
#
# `BOOM_GW_SCITOKEN` is the bearer token the clusterer uses to
# authenticate against the LIGO GraceDB Kafka topics. Generate with
# `htgettoken -a vault.ligo.org -i igwn` (see `bayestar-service/`
# README for the full incantation); the contents of the resulting
# token file go here.
apiVersion: v1
kind: Secret
metadata:
  name: boom-gw-secrets
  namespace: umn-babamul
type: Opaque
stringData:
  BOOM_GW_MONGO_PASSWORD: "YOUR_MONGO_PASSWORD"
  BOOM_GW_SCITOKEN: "YOUR_SCITOKEN_JWT"

# Boom-gw secrets for the NRP deployment. Copy to `secrets.yaml`,
# fill in real values, then apply with `make deploy-secrets`.
#
# Generate the random values with:
#   openssl rand -base64 32   # SESSION_SECRET (HMAC, never URL-embedded)
#   openssl rand -hex 32      # MONGO_PASSWORD — see note below
#   openssl rand -base64 24   # MinIO root password
#
# MONGO_PASSWORD MUST be URL-safe (no `/`, `+`, `=`). gw-api builds
# the connection URI as `mongodb://mongoadmin:<password>@mongo:...`
# and does NOT URL-encode the embedded password — a `/` in the
# string terminates the password segment early and mongo SCRAM-rejects
# the auth handshake. Hex output sidesteps the issue; if you must use
# base64, `| tr -d '/+='` first.
#
# Fields:
#
# * `BOOM_GW_MONGO_PASSWORD` — root password set on the mongo
#   StatefulSet. Every component that talks to mongo reads it from
#   this Secret.
#
# * `BOOM_GW_SESSION_SECRET` — HMAC secret used to sign the
#   `boom_gw_session` cookie. Must be >= 32 random bytes. Rotating
#   it silently logs every signed-in user out on the next request,
#   so don't churn it casually.
#
# * `BOOM_GW_SCITOKEN` — bearer JWT the clusterer uses to authenticate
#   against `kafka-dev.ligo.org`. Generate with
#   `htgettoken -a vault.ligo.org -i igwn`. Short-lived (~10 h) — the
#   pod must be restarted (or the Secret rotated) before expiry.
#
# * `BOOM_GW_ALERT_PUBLISHERS` — comma-separated list of `sub` claim
#   values permitted to POST `/api/superevents/{id}/alerts`. The
#   clusterer's service account belongs here; human users with read
#   tokens do not. Example: "boom-gw-clusterer@ligo.org". Leave blank
#   and gw-api will log a warning at startup that the gate is open
#   (anyone authenticated can publish), which is fine for first-boot
#   smoke testing but NOT for production.
#
# * `BOOM_GW_S3_*` — credentials gw-api uses to talk to the
#   in-cluster MinIO from k8s/storage/minio.yaml. Match the access
#   key + root password in that file.
#
# * `BOOM_GW_OIDC_*` — CILogon OIDC client for the SPA's "Sign in
#   with LIGO.org" button. Register at
#   https://cilogon.org/oauth2/register; redirect URI must match
#   `BOOM_GW_OIDC_REDIRECT_URI` in core/gw-api.yaml exactly. Leave
#   blank to keep the dev-login form as the only sign-in path.
apiVersion: v1
kind: Secret
metadata:
  name: boom-gw-secrets
type: Opaque
stringData:
  BOOM_GW_MONGO_PASSWORD: "YOUR_MONGO_PASSWORD"
  BOOM_GW_SESSION_SECRET: "YOUR_SESSION_SECRET_AT_LEAST_32_BYTES"
  BOOM_GW_SCITOKEN: "YOUR_SCITOKEN_JWT"
  BOOM_GW_ALERT_PUBLISHERS: ""

  # In-cluster MinIO credentials. Default access key in
  # k8s/storage/minio.yaml is `boomgw`; match the secret key to
  # whatever that StatefulSet's root password is set to.
  BOOM_GW_S3_ACCESS_KEY: "boomgw"
  BOOM_GW_S3_SECRET_KEY: "YOUR_MINIO_ROOT_PASSWORD"

  # CILogon OIDC client (optional). Set both to enable the SPA's
  # "Sign in with LIGO.org" button; leave blank to fall back to
  # /api/auth/dev-login (gated on BOOM_GW_API_AUTH_DEV_MODE).
  BOOM_GW_OIDC_CLIENT_ID: ""
  BOOM_GW_OIDC_CLIENT_SECRET: ""

  # GCN-Kafka OIDC client. Issued at https://gcn.nasa.gov/quickstart
  # — one pair per consumer. Required by the `gw-gcn-consumer`
  # Deployment when --auth=oidc (the default in production). Leave
  # blank if you're not running gw-gcn-consumer in this namespace.
  BOOM_GW_GCN_CLIENT_ID: ""
  BOOM_GW_GCN_CLIENT_SECRET: ""

# Read-only HTTP API over the boom-gw archive. Stateless; the
# Service + Ingress expose it at boom-gw-api.nrp-nautilus.io.
#
# This pod runs without the alert-publisher Kafka client — alert
# publishing is initiated from the clusterer / ingestion side. To
# enable POST /api/superevents/{id}/alerts publishing here, set
# BOOM_GW_ALERT_SERVERS=broker:29092 once the ingestion stack is
# also deployed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-api
  namespace: umn-babamul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gw-api
  template:
    metadata:
      labels:
        app: gw-api
    spec:
      containers:
        - name: gw-api
          image: ghcr.io/boom-astro/boom-gw:latest
          imagePullPolicy: Always
          command: ["/app/gw-api"]
          ports:
            - containerPort: 8080
          env:
            - name: BOOM_GW_MONGO_URI
              value: "mongodb://mongoadmin:$(BOOM_GW_MONGO_PASSWORD)@mongo:27017/admin?authSource=admin"
            - name: BOOM_GW_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_MONGO_PASSWORD
            - name: BOOM_GW_API_BIND
              value: "0.0.0.0:8080"
            - name: BOOM_GW_METRICS_ENABLED
              value: "true"
            - name: BOOM_GW_DEPLOYMENT_ENV
              value: "nrp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: RUST_LOG
              value: "info,boom_gw=info,actix_web=info"
            # Auth — accept IGWN tokens from the standard CILogon
            # issuers; require `gracedb.read` scope (matches
            # GraceDB's policy). The alert-publisher allowlist gates
            # POST /api/superevents/{id}/alerts to the principals
            # listed; everything else is open to any authenticated
            # IGWN user.
            - name: BOOM_GW_ALERT_PUBLISHERS
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_ALERT_PUBLISHERS
                  optional: true
            # Skymap storage backend — `mongo` (default) keeps the
            # FITS bytes in a separate `skymaps` collection on the
            # same database; `s3` pushes them to an S3-compatible
            # object store (in-cluster MinIO via k8s/storage/, an
            # external rustfs, or real AWS S3). When switching to
            # s3, the four BOOM_GW_S3_* values below must be
            # supplied via boom-gw-secrets.
            - name: BOOM_GW_SKYMAP_STORAGE
              value: "mongo"
            - name: BOOM_GW_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_BUCKET
                  optional: true
            - name: BOOM_GW_S3_KEY_PREFIX
              value: "boom-gw"
            - name: BOOM_GW_S3_REGION
              value: "us-east-1"
            - name: BOOM_GW_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_ENDPOINT_URL
                  optional: true
            - name: BOOM_GW_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_ACCESS_KEY
                  optional: true
            - name: BOOM_GW_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_SECRET_KEY
                  optional: true
            # Read cache in front of S3 (uses valkey from the
            # ingestion stack). 30s default TTL is enough that a
            # quick re-fetch of the same skymap hits the cache.
            - name: BOOM_GW_S3_CACHE_REDIS_URL
              value: "redis://valkey:6379/"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gw-api
  namespace: umn-babamul
spec:
  selector:
    app: gw-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gw-api-ingress
  namespace: umn-babamul
  annotations:
    kubernetes.io/ingress.class: "haproxy"
spec:
  rules:
    - host: boom-gw-api.nrp-nautilus.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gw-api
                port:
                  number: 8080
  tls:
    - hosts:
        - boom-gw-api.nrp-nautilus.io

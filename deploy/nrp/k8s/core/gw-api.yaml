# Read-only HTTP API over the boom-gw archive. Stateless; the
# Service + Ingress expose it at boom-gw-api.nrp-nautilus.io.
#
# This pod runs without the alert-publisher Kafka client — alert
# publishing is initiated from the clusterer / ingestion side. To
# enable POST /api/superevents/{id}/alerts publishing here, set
# BOOM_GW_ALERT_SERVERS=broker:29092 once the ingestion stack is
# also deployed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gw-api
  template:
    metadata:
      labels:
        app: gw-api
    spec:
      # Wait for MinIO to be reachable and create the
      # `boom-gw-skymaps` bucket before gw-api starts. gw-api's
      # startup runs `head_bucket` against `BOOM_GW_S3_BUCKET` and
      # crashes with `dispatch failure` if the bucket isn't there.
      # `mc mb --ignore-existing` is idempotent so a pod restart
      # is harmless.
      initContainers:
        - name: minio-bucket-bootstrap
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null 2>&1; then
                  break
                fi
                echo "waiting for MinIO ($i/60)..."
                sleep 2
              done
              mc mb --ignore-existing "local/$BOOM_GW_S3_BUCKET"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_SECRET_KEY
            - name: BOOM_GW_S3_BUCKET
              value: "boom-gw-skymaps"
      containers:
        - name: gw-api
          image: ghcr.io/boom-astro/boom-gw:latest
          imagePullPolicy: Always
          command: ["/app/gw-api"]
          # `--static-dir` makes gw-api serve the SPA at `/` as the
          # catch-all so /api/* and the web UI share an origin
          # (required for the session cookie + the OIDC redirect
          # URI). The bundle is baked into the image by the
          # Dockerfile's web-builder stage.
          args: ["--static-dir", "/app/web/dist"]
          ports:
            - containerPort: 8080
          env:
            - name: BOOM_GW_MONGO_URI
              value: "mongodb://mongoadmin:$(BOOM_GW_MONGO_PASSWORD)@mongo:27017/admin?authSource=admin"
            - name: BOOM_GW_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_MONGO_PASSWORD
            - name: BOOM_GW_API_BIND
              value: "0.0.0.0:8080"
            - name: BOOM_GW_METRICS_ENABLED
              value: "true"
            - name: BOOM_GW_DEPLOYMENT_ENV
              value: "nrp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: RUST_LOG
              value: "info,boom_gw=info,actix_web=info"
            # ---- Session-cookie auth ----
            # SESSION_SECRET signs the boom_gw_session JWT cookie;
            # generate with `openssl rand -base64 32` and store in
            # boom-gw-secrets. SECURE=true marks the cookie
            # HTTPS-only — the HAProxy ingress terminates TLS in
            # front of us. AUTH_DEV_MODE enables /api/auth/dev-login
            # (the click-to-sign-in form) until the CILogon OIDC
            # client is registered; flip to false once
            # BOOM_GW_OIDC_CLIENT_ID + _SECRET land in
            # boom-gw-secrets.
            - name: BOOM_GW_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_SESSION_SECRET
            - name: BOOM_GW_SESSION_SECURE
              value: "true"
            - name: BOOM_GW_API_AUTH_DEV_MODE
              value: "true"
            # OIDC: optional today. When set, the SPA's `Sign in
            # with LIGO.org` button is enabled and the
            # authorization-code flow redirects to CILogon →
            # LIGO.org Shibboleth → back here.
            - name: BOOM_GW_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_OIDC_CLIENT_ID
                  optional: true
            - name: BOOM_GW_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_OIDC_CLIENT_SECRET
                  optional: true
            - name: BOOM_GW_OIDC_REDIRECT_URI
              value: "https://boom-gw-api.nrp-nautilus.io/api/auth/callback"
            # Alert-publisher allowlist gates POST
            # /api/superevents/{id}/alerts to the principals listed.
            # Other authenticated users can read + annotate.
            - name: BOOM_GW_ALERT_PUBLISHERS
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_ALERT_PUBLISHERS
                  optional: true
            # ---- Skymap storage on in-cluster MinIO ----
            # MinIO Service from k8s/storage/minio.yaml.
            # `BOOM_GW_S3_BUCKET` defaults to boom-gw-skymaps; the
            # MinIO init job (in the same manifest) creates it on
            # first boot.
            - name: BOOM_GW_SKYMAP_STORAGE
              value: "s3"
            - name: BOOM_GW_S3_BUCKET
              value: "boom-gw-skymaps"
            - name: BOOM_GW_S3_KEY_PREFIX
              value: "boom-gw"
            - name: BOOM_GW_S3_REGION
              value: "us-east-1"
            - name: BOOM_GW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: BOOM_GW_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_ACCESS_KEY
            - name: BOOM_GW_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_S3_SECRET_KEY
            # Read cache in front of S3 (uses valkey from the
            # ingestion stack). 30s default TTL is enough that a
            # quick re-fetch of the same skymap hits the cache.
            - name: BOOM_GW_S3_CACHE_REDIS_URL
              value: "redis://valkey:6379/"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gw-api
spec:
  selector:
    app: gw-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gw-api-ingress
  annotations:
    kubernetes.io/ingress.class: "haproxy"
spec:
  rules:
    - host: boom-gw-api.nrp-nautilus.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gw-api
                port:
                  number: 8080
  tls:
    - hosts:
        - boom-gw-api.nrp-nautilus.io

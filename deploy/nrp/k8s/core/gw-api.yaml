# Read-only HTTP API over the boom-gw archive. Stateless; the
# Service + Ingress expose it at boom-gw-api.nrp-nautilus.io.
#
# This pod runs without the alert-publisher Kafka client — alert
# publishing is initiated from the clusterer / ingestion side. To
# enable POST /api/superevents/{id}/alerts publishing here, set
# BOOM_GW_ALERT_SERVERS=broker:29092 once the ingestion stack is
# also deployed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-api
  namespace: umn-babamul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gw-api
  template:
    metadata:
      labels:
        app: gw-api
    spec:
      containers:
        - name: gw-api
          image: ghcr.io/boom-astro/boom-gw:latest
          imagePullPolicy: Always
          command: ["/app/gw-api"]
          ports:
            - containerPort: 8080
          env:
            - name: BOOM_GW_MONGO_URI
              value: "mongodb://mongoadmin:$(BOOM_GW_MONGO_PASSWORD)@mongo:27017/admin?authSource=admin"
            - name: BOOM_GW_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boom-gw-secrets
                  key: BOOM_GW_MONGO_PASSWORD
            - name: BOOM_GW_API_BIND
              value: "0.0.0.0:8080"
            - name: BOOM_GW_METRICS_ENABLED
              value: "true"
            - name: BOOM_GW_DEPLOYMENT_ENV
              value: "nrp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: RUST_LOG
              value: "info,boom_gw=info,actix_web=info"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gw-api
  namespace: umn-babamul
spec:
  selector:
    app: gw-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gw-api-ingress
  namespace: umn-babamul
  annotations:
    kubernetes.io/ingress.class: "haproxy"
spec:
  rules:
    - host: boom-gw-api.nrp-nautilus.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gw-api
                port:
                  number: 8080
  tls:
    - hosts:
        - boom-gw-api.nrp-nautilus.io

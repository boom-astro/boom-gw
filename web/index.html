      Aladin Lite v3. The v3 CDN serves only `aladin.js` (no `.min.js`

      type="text/javascript"
      src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"
      charset="utf-8"
      defer
    ></script>

  </body>
